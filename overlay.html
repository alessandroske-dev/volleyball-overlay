<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Volleyball Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent; width: 1920px; height: 1080px; overflow: hidden;
    font-family: 'Barlow Condensed', sans-serif;
    --ov-accent:     #f0a500;
    --ov-away:       #e53e3e;
    --ov-score-bg:   #1a1a1a;
    --ov-team-text:  #ffffff;
    --ov-score-text: #1a1a1a;
    --ov-font:       'Barlow Condensed';
    --ov-score-size: 48px;
    --ov-name-size:  28px;
    --ov-sb-height:  74px;
    --ov-opacity:    1;
  }

  /* COMPETITION */
  #competition { position: absolute; top: 32px; left: 40px; animation: slideIn 0.6s ease both; }
  .comp-label { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--ov-accent); text-transform: uppercase; text-shadow: 0 1px 8px rgba(0,0,0,0.9); display: block; }
  .comp-name  { font-size: 24px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; text-shadow: 0 2px 14px rgba(0,0,0,0.95); display: block; }

  /* SPONSOR BANNER */
  #sponsor {
    position: absolute; top: 28px; right: 40px;
    background: #fff; border-radius: 12px;
    padding: 10px 16px;
    display: none; align-items: center; justify-content: center;
    max-width: 300px; min-width: 120px; max-height: 120px;
    box-shadow: 0 4px 28px rgba(0,0,0,0.55);
    animation: fadeIn 0.4s ease both;
  }
  #sponsor.visible { display: flex; }
  #sponsor img { max-width: 268px; max-height: 100px; object-fit: contain; display: block; }
  #sponsor-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    color: #aaa; text-transform: uppercase; text-align: center;
    position: absolute; bottom: -18px; right: 0;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }

  /* SCOREBOARD */
  #scoreboard { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; filter: drop-shadow(0 6px 28px rgba(0,0,0,0.75)); overflow: visible; }

  .team-block { display: flex; align-items: center; background: var(--ov-score-bg); height: var(--ov-sb-height); padding: 0 22px; gap: 14px; min-width: 260px; opacity: var(--ov-opacity); }
  .team-block.home { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 100%, 0 100%); padding-right: 32px; }
  .team-block.away { clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%); padding-left: 32px; }

  .team-logo { width: 46px; height: 46px; border-radius: 50%; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; overflow: hidden; }
  .team-logo img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .team-logo img.visible { display: block; }
  .team-logo .emoji { line-height: 1; }
  .team-name { font-weight: 900; font-size: var(--ov-name-size); letter-spacing: 0.04em; color: var(--ov-team-text); text-transform: uppercase; white-space: nowrap; }

  .sets-box { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; height: var(--ov-sb-height); width: 50px; gap: 2px; opacity: var(--ov-opacity); }
  .sets-label { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: #666; text-transform: uppercase; }
  .sets-value { font-size: 30px; font-weight: 900; color: var(--ov-accent); line-height: 1; }

  .center-block { display: flex; align-items: center; background: var(--ov-accent); height: var(--ov-sb-height); opacity: var(--ov-opacity); }
  .score-box { display: flex; align-items: center; justify-content: center; width: 66px; height: var(--ov-sb-height); }
  .score-value { font-size: var(--ov-score-size); font-weight: 900; color: var(--ov-score-text); line-height: 1; transition: transform 0.12s cubic-bezier(.36,.07,.19,.97); }
  .score-value.bump { transform: scale(1.3); }
  .score-sep { width: 3px; height: 38px; background: rgba(0,0,0,0.2); border-radius: 2px; }

  /* SET POPUP */
  #set-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: var(--ov-accent); color: var(--ov-score-text); padding: 18px 52px; font-size: 38px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); z-index: 100; white-space: nowrap; }
  #set-popup.show { transform: translate(-50%, -50%) scale(1); }

  /* TICKER
     FIX: usa 1920px esplicito invece di 100vw — il body è fisso 1920px
     e la viewport del browser OBS potrebbe non coincidere con vw */
  #ticker-wrap {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    /* FIX: width esplicita — in OBS browser source 100vw può non coincidere con il body 1920px */
    width: 1920px;
    display: none;
    align-items: center;
    background: #1a1a1a;
    height: 34px;
    overflow: hidden;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.6));
    white-space: nowrap;
  }
  #ticker-wrap.visible { display: flex; }
  #ticker-tag {
    background: var(--ov-accent); color: var(--ov-score-text);
    font-size: 13px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0 20px 0 14px; height: 100%; display: flex; align-items: center; flex-shrink: 0;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 100%, 0 100%);
  }
  #ticker-track { overflow: hidden; flex: 1; height: 100%; position: relative; }
  #ticker-text {
    display: inline-block; white-space: nowrap;
    font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.04em;
    line-height: 34px; padding-left: 1920px;
    /* FIX: animation-duration parte a 0s — viene impostata via JS dopo il primo scrollWidth.
       Senza questo, la prima chiamata a applyTicker parte con la durata di default del browser */
    animation: ticker-scroll linear infinite;
    animation-duration: 0s;
  }
  @keyframes ticker-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(calc(-100% - 1920px)); }
  }

  /* ROSTER */
  #roster-wrap { display: block; position: static; } /* anchor per colonne assolute in scoreboard */
  .roster-col {
    position: absolute; bottom: 74px; max-height: 820px;
    display: none; flex-direction: column; gap: 1px;
    background: rgba(18,18,18,0.93); padding: 10px 18px 12px;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,0.7));
    opacity: 0; transition: opacity 0.4s ease;
    min-width: 260px; max-width: 360px; overflow: hidden;
  }
  .roster-col.show    { opacity: 1; }
  .roster-col.visible { display: flex; }
  #roster-col-home {
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 100%, 0 100%);
    padding-right: 26px; border-top: 3px solid var(--ov-accent); align-items: flex-start; left: 0;
  }
  #roster-col-away {
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%);
    padding-left: 26px; border-top: 3px solid var(--ov-away); align-items: flex-start; right: 0;
  }
  .roster-col-label { font-size: 9px; font-weight: 700; letter-spacing: 0.16em; color: #777; text-transform: uppercase; margin-bottom: 5px; }
  .roster-name { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .roster-name .num { font-size: 11px; font-weight: 900; color: var(--ov-accent); margin-right: 5px; display: inline-block; min-width: 16px; text-align: right; }

  /* ── SCOUT STATS PANEL ──────────────────────────────────────────
     Usa visibility+opacity invece di display:none
     così la transizione CSS funziona sempre senza race conditions
  ──────────────────────────────────────────────────────────────── */
  #scout-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 860px;
    background: rgba(15,15,15,0.96);
    border-radius: 18px;
    padding: 28px 32px 24px;
    filter: drop-shadow(0 8px 40px rgba(0,0,0,0.85));
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 4px solid #a855f7;
    z-index: 50;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, visibility 0s linear 0.4s;
  }
  #scout-panel.show {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.4s ease, visibility 0s linear 0s;
  }

  .scout-panel-header {
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;
  }
  .scout-panel-title {
    font-size: 13px; font-weight: 700; letter-spacing: 0.18em;
    color: #a855f7; text-transform: uppercase; text-align: center;
  }
  .scout-team-names { display: flex; justify-content: space-between; width: 100%; }
  .scout-panel-team { font-size: 22px; font-weight: 900; letter-spacing: 0.05em; color: #fff; text-transform: uppercase; }
  .scout-panel-team.home { color: var(--ov-accent); }
  .scout-panel-team.away { color: var(--ov-away); }

  .scout-row {
    display: grid;
    grid-template-columns: 1fr 200px 1fr;
    align-items: center;
    gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .scout-row:last-child { border-bottom: none; }

  .scout-bar-home-wrap { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .scout-bar-away-wrap { display: flex; align-items: center; gap: 10px; justify-content: flex-start; }

  .scout-num { font-size: 26px; font-weight: 900; min-width: 30px; font-family: 'Barlow Condensed', sans-serif; line-height: 1; }
  .scout-num.home { color: var(--ov-accent); text-align: right; }
  .scout-num.away { color: var(--ov-away); text-align: left; }

  .scout-bar-track { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.08); flex: 1; overflow: hidden; position: relative; }
  .scout-bar-fill-home { position: absolute; right: 0; top: 0; height: 100%; background: var(--ov-accent); border-radius: 5px; transition: width 0.6s cubic-bezier(.23,1,.32,1); }
  .scout-bar-fill-away { position: absolute; left: 0; top: 0; height: 100%; background: var(--ov-away); border-radius: 5px; transition: width 0.6s cubic-bezier(.23,1,.32,1); }

  .scout-center-label { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .scout-stat-label { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.13em; color: #666; text-transform: uppercase; white-space: nowrap; }
  .scout-pct-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px; }
  .scout-pct { font-size: 13px; font-weight: 900; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.05em; min-width: 36px; text-align: center; }
  .scout-pct.home { color: var(--ov-accent); text-align: left; }
  .scout-pct.away { color: var(--ov-away); text-align: right; }

  @keyframes slideIn { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeIn  { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

  /* AD BANNER — carosello multi-slide */
  #ad-banner {
    position: absolute;
    bottom: 125px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: rgba(15,15,15,0.96);
    border-radius: 14px;
    border-left: 4px solid #ec4899;
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: 700px;
    min-width: 320px;
    filter: drop-shadow(0 6px 32px rgba(0,0,0,0.8));
    overflow: hidden;          /* clips la slide in uscita */
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease, visibility 0s linear 0.4s;
  }
  #ad-banner.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
    transition: opacity 0.4s ease, transform 0.4s ease, visibility 0s linear 0s;
  }
  /* Le slide sono posizionate in un viewport interno */
  #ad-slides-viewport {
    position: relative;
    width: 100%;
    overflow: hidden;
  }
  .ad-slide {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 22px 14px 16px;
    width: 100%;
    /* transizione slide */
    position: absolute; top: 0; left: 0;
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }
  .ad-slide.active {
    position: relative;   /* occupa spazio nel flusso → determina altezza viewport */
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }
  .ad-slide.exit {
    opacity: 0;
    transform: translateX(-40px);
  }
  .ad-slide-img {
    width: 80px; height: 56px; border-radius: 8px;
    object-fit: contain; background: #fff;
    padding: 4px; flex-shrink: 0; display: none;
  }
  .ad-slide-img.visible { display: block; }
  .ad-slide-body { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .ad-slide-tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
    color: #ec4899; text-transform: uppercase;
  }
  .ad-slide-title {
    font-size: 22px; font-weight: 900; color: #fff;
    letter-spacing: 0.04em; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .ad-slide-text {
    font-size: 14px; color: #aaa; letter-spacing: 0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ad-slide-link {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
    background: #ec4899; color: #fff; border-radius: 6px;
    padding: 5px 14px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    white-space: nowrap; align-self: flex-start;
  }
  /* paginazione punti */
  #ad-dots {
    position: absolute;
    bottom: 7px; right: 12px;
    display: flex; gap: 5px; align-items: center;
  }
  .ad-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #555; transition: background 0.3s;
  }
  .ad-dot.on { background: #ec4899; }
</style>
</head>
<body>

<div id="competition">
  <span class="comp-label" id="comp-label-el">Eccellenza FIPAV</span>
  <span class="comp-name"  id="comp-name-el">Finale 3° - 4° Posto</span>
</div>

<div id="sponsor">
  <img id="sponsor-img" alt="Sponsor">
  <span id="sponsor-label">Sponsor</span>
</div>

<div id="ticker-wrap">
  <div id="ticker-tag">📢 News</div>
  <div id="ticker-track"><span id="ticker-text"></span></div>
</div>

<!-- AD BANNER carosello -->
<div id="ad-banner">
  <div id="ad-slides-viewport">
    <!-- slides iniettate via JS -->
  </div>
  <div id="ad-dots"></div>
</div>

<!-- SCOUT STATS PANEL -->
<div id="scout-panel">
  <div class="scout-panel-header">
    <span class="scout-panel-title">📊 Statistiche Partita</span>
    <div class="scout-team-names">
      <span class="scout-panel-team home" id="sp-home-name">CASA</span>
      <span class="scout-panel-team away" id="sp-away-name">OSPITE</span>
    </div>
  </div>

  <div class="scout-row">
    <div class="scout-bar-home-wrap">
      <span class="scout-num home" id="sn-home-ace">0</span>
      <div class="scout-bar-track"><div class="scout-bar-fill-home" id="sb-home-ace" style="width:50%"></div></div>
    </div>
    <div class="scout-center-label">
      <div class="scout-pct-row">
        <span class="scout-pct home" id="sp-home-ace">-</span>
        <span class="scout-stat-label">Ace</span>
        <span class="scout-pct away" id="sp-away-ace">-</span>
      </div>
    </div>
    <div class="scout-bar-away-wrap">
      <div class="scout-bar-track"><div class="scout-bar-fill-away" id="sb-away-ace" style="width:50%"></div></div>
      <span class="scout-num away" id="sn-away-ace">0</span>
    </div>
  </div>

  <div class="scout-row">
    <div class="scout-bar-home-wrap">
      <span class="scout-num home" id="sn-home-srvErr">0</span>
      <div class="scout-bar-track"><div class="scout-bar-fill-home" id="sb-home-srvErr" style="width:50%"></div></div>
    </div>
    <div class="scout-center-label">
      <div class="scout-pct-row">
        <span class="scout-pct home" id="sp-home-srvErr">-</span>
        <span class="scout-stat-label">Err. Servizio</span>
        <span class="scout-pct away" id="sp-away-srvErr">-</span>
      </div>
    </div>
    <div class="scout-bar-away-wrap">
      <div class="scout-bar-track"><div class="scout-bar-fill-away" id="sb-away-srvErr" style="width:50%"></div></div>
      <span class="scout-num away" id="sn-away-srvErr">0</span>
    </div>
  </div>

  <div class="scout-row">
    <div class="scout-bar-home-wrap">
      <span class="scout-num home" id="sn-home-att">0</span>
      <div class="scout-bar-track"><div class="scout-bar-fill-home" id="sb-home-att" style="width:50%"></div></div>
    </div>
    <div class="scout-center-label">
      <div class="scout-pct-row">
        <span class="scout-pct home" id="sp-home-att">-</span>
        <span class="scout-stat-label">Attacchi Vint.</span>
        <span class="scout-pct away" id="sp-away-att">-</span>
      </div>
    </div>
    <div class="scout-bar-away-wrap">
      <div class="scout-bar-track"><div class="scout-bar-fill-away" id="sb-away-att" style="width:50%"></div></div>
      <span class="scout-num away" id="sn-away-att">0</span>
    </div>
  </div>

  <div class="scout-row">
    <div class="scout-bar-home-wrap">
      <span class="scout-num home" id="sn-home-attErr">0</span>
      <div class="scout-bar-track"><div class="scout-bar-fill-home" id="sb-home-attErr" style="width:50%"></div></div>
    </div>
    <div class="scout-center-label">
      <div class="scout-pct-row">
        <span class="scout-pct home" id="sp-home-attErr">-</span>
        <span class="scout-stat-label">Err. Attacco</span>
        <span class="scout-pct away" id="sp-away-attErr">-</span>
      </div>
    </div>
    <div class="scout-bar-away-wrap">
      <div class="scout-bar-track"><div class="scout-bar-fill-away" id="sb-away-attErr" style="width:50%"></div></div>
      <span class="scout-num away" id="sn-away-attErr">0</span>
    </div>
  </div>

  <div class="scout-row">
    <div class="scout-bar-home-wrap">
      <span class="scout-num home" id="sn-home-block">0</span>
      <div class="scout-bar-track"><div class="scout-bar-fill-home" id="sb-home-block" style="width:50%"></div></div>
    </div>
    <div class="scout-center-label">
      <div class="scout-pct-row">
        <span class="scout-pct home" id="sp-home-block">-</span>
        <span class="scout-stat-label">Muri</span>
        <span class="scout-pct away" id="sp-away-block">-</span>
      </div>
    </div>
    <div class="scout-bar-away-wrap">
      <div class="scout-bar-track"><div class="scout-bar-fill-away" id="sb-away-block" style="width:50%"></div></div>
      <span class="scout-num away" id="sn-away-block">0</span>
    </div>
  </div>

  <div class="scout-row">
    <div class="scout-bar-home-wrap">
      <span class="scout-num home" id="sn-home-rec">-</span>
      <div class="scout-bar-track"><div class="scout-bar-fill-home" id="sb-home-rec" style="width:50%"></div></div>
    </div>
    <div class="scout-center-label">
      <div class="scout-pct-row">
        <span class="scout-pct home" id="sp-home-rec">-</span>
        <span class="scout-stat-label">Ricezione %</span>
        <span class="scout-pct away" id="sp-away-rec">-</span>
      </div>
    </div>
    <div class="scout-bar-away-wrap">
      <div class="scout-bar-track"><div class="scout-bar-fill-away" id="sb-away-rec" style="width:50%"></div></div>
      <span class="scout-num away" id="sn-away-rec">-</span>
    </div>
  </div>
</div>

<div id="scoreboard">
  <div id="roster-wrap">
    <div class="roster-col home" id="roster-col-home">
      <div class="roster-col-label" id="roster-home-label">CASA</div>
      <div id="roster-home-names"></div>
    </div>
    <div class="roster-col away" id="roster-col-away">
      <div class="roster-col-label" id="roster-away-label">OSPITE</div>
      <div id="roster-away-names"></div>
    </div>
  </div>
  <div class="team-block home">
    <div class="team-logo" id="home-logo-wrap">
      <span class="emoji">🏐</span>
      <img id="home-logo-img" alt="">
    </div>
    <span class="team-name" id="home-name">CASA</span>
  </div>
  <div class="sets-box">
    <span class="sets-label">Set</span>
    <span class="sets-value" id="home-sets">0</span>
  </div>
  <div class="center-block">
    <div class="score-box"><span class="score-value" id="home-score">0</span></div>
    <div class="score-sep"></div>
    <div class="score-box"><span class="score-value" id="away-score">0</span></div>
  </div>
  <div class="sets-box">
    <span class="sets-label">Set</span>
    <span class="sets-value" id="away-sets">0</span>
  </div>
  <div class="team-block away">
    <span class="team-name" id="away-name">OSPITE</span>
    <div class="team-logo" id="away-logo-wrap">
      <span class="emoji">🏐</span>
      <img id="away-logo-img" alt="">
    </div>
  </div>
</div>

<div id="set-popup">SET!</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJLdA9iKxoR3WJSrjGM7ltUpjpDRNyiyQ",
    authDomain: "volley-overlay.firebaseapp.com",
    databaseURL: "https://volley-overlay-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "volley-overlay",
    storageBucket: "volley-overlay.firebasestorage.app",
    messagingSenderId: "643750913822",
    appId: "1:643750913822:web:3c1fde3fdceb6a71e3cb0f"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const auth = getAuth(app);

  // Auth anonima per OBS (nessun popup, solo lettura)
  signInAnonymously(auth).catch(() => {});
  let prev = {};

  // ── TEMA (aggiornamento realtime da tema.html) ────────────────────
  function loadFont(family) {
    const map = { 'Oswald':'Oswald:wght@400;700', 'Anton':'Anton', 'Bebas Neue':'Bebas+Neue', 'Teko':'Teko:wght@400;600;700', 'Rajdhani':'Rajdhani:wght@400;600;700' };
    if (!map[family]) return;
    const id = 'gf-' + family.replace(/ /g,'-');
    if (document.getElementById(id)) return;
    const l = document.createElement('link'); l.id=id; l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family='+map[family]+'&display=swap';
    document.head.appendChild(l);
  }
  function applyTheme(t) {
    if (!t) return;
    const s = document.body.style;
    if (t.accent)              s.setProperty('--ov-accent',     t.accent);
    if (t.away)                s.setProperty('--ov-away',       t.away);
    if (t.scoreBg)             s.setProperty('--ov-score-bg',   t.scoreBg);
    if (t.teamText)            s.setProperty('--ov-team-text',  t.teamText);
    if (t.scoreText)           s.setProperty('--ov-score-text', t.scoreText);
    if (t.font)                { loadFont(t.font); s.setProperty('--ov-font', "'"+t.font+"'"); document.body.style.fontFamily = "'"+t.font+"', sans-serif"; }
    if (t.scoreSize)           s.setProperty('--ov-score-size', t.scoreSize+'px');
    if (t.nameSize)            s.setProperty('--ov-name-size',  t.nameSize+'px');
    if (t.sbHeight)            s.setProperty('--ov-sb-height',  t.sbHeight+'px');
    if (t.opacity !== undefined) s.setProperty('--ov-opacity', t.opacity/100);
  }
  onValue(ref(db, 'theme'), (snap) => { applyTheme(snap.val()); });

  // FIX: gestione popup concorrenti — una sola istanza alla volta con coda
  let popupTimer = null;
  let popupQueue = [];

  function drainPopupQueue() {
    if (popupQueue.length === 0) return;
    const name = popupQueue.shift();
    const p = document.getElementById('set-popup');
    p.textContent = 'SET — ' + name;
    p.classList.add('show');
    popupTimer = setTimeout(() => {
      p.classList.remove('show');
      popupTimer = null;
      setTimeout(drainPopupQueue, 350);
    }, 2800);
  }

  function showPopup(name) {
    popupQueue.push(name);
    if (!popupTimer) drainPopupQueue();
  }

  function bump(id) {
    const el = document.getElementById(id);
    if (!el) return; // FIX: guard null — evita crash silenzioso su ID errato
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 200);
  }

  function applyLogo(team, url) {
    const img   = document.getElementById(team + '-logo-img');
    // FIX: querySelector relativo al parent invece di previousElementSibling
    // (fragile se l'ordine dei tag nel DOM cambia)
    const emoji = img.closest('.team-logo').querySelector('.emoji');
    if (url) { img.src = url; img.classList.add('visible'); emoji.style.display = 'none'; }
    else      { img.classList.remove('visible'); emoji.style.display = 'block'; }
  }

  function applySponsor(url, label, visible) {
    const wrap = document.getElementById('sponsor');
    const img  = document.getElementById('sponsor-img');
    const lbl  = document.getElementById('sponsor-label');
    if (url && visible) {
      img.src = url; lbl.textContent = label || '';
      wrap.classList.add('visible');
    } else {
      wrap.classList.remove('visible');
    }
  }

  function applyTicker(text1, vis1, text2, vis2) {
    const wrap = document.getElementById('ticker-wrap');
    // FIX: rimossa variabile 'track' orfana (dichiarata ma mai usata)
    const text    = vis1 ? text1 : (vis2 ? text2 : '');
    const visible = vis1 || vis2;
    if (text && visible) {
      let span = document.getElementById('ticker-text');
      if (span.textContent !== text) {
        span.textContent = text;
        // FIX: cloneNode per reset animazione affidabile (void offsetWidth non basta se
        // l'animazione è già in corso; il clone forza il browser a creare nuova istanza)
        const clone = span.cloneNode(true);
        span.parentNode.replaceChild(clone, span);
        span = clone;
        // FIX: animation-duration calcolata e applicata subito nel primo frame disponibile
        // (prima di questa fix, la prima chiamata partiva senza duration → durata 0)
        requestAnimationFrame(() => {
          const duration = (span.scrollWidth + 1920) / 120;
          span.style.animationDuration = Math.max(5, duration) + 's';
        });
      }
      wrap.classList.add('visible');
    } else {
      wrap.classList.remove('visible');
    }
  }

  function buildNames(containerId, text) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    (text || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
      const div = document.createElement('div');
      div.className = 'roster-name';
      const m = line.match(/^(\d+)\s+(.+)/);
      if (m) {
        // FIX: usa textContent per le parti di testo — evita XSS da dati Firebase
        const numSpan = document.createElement('span');
        numSpan.className = 'num';
        numSpan.textContent = m[1];
        const nameNode = document.createTextNode(m[2]);
        div.appendChild(numSpan);
        div.appendChild(nameNode);
      } else {
        div.textContent = line;
      }
      el.appendChild(div);
    });
  }

  function applyRoster(homeText, awayText, homeName, awayName, homeVisible, awayVisible) {
    document.getElementById('roster-home-label').textContent = (homeName || 'CASA').toUpperCase();
    document.getElementById('roster-away-label').textContent = (awayName || 'OSPITE').toUpperCase();
    buildNames('roster-home-names', homeText);
    buildNames('roster-away-names', awayText);
    function toggleCol(el, visible) {
      if (visible) {
        el.classList.add('visible');
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
      } else {
        el.classList.remove('show');
        setTimeout(() => el.classList.remove('visible'), 400);
      }
    }
    toggleCol(document.getElementById('roster-col-home'), homeVisible);
    toggleCol(document.getElementById('roster-col-away'), awayVisible);
  }

  // ── AD BANNER CAROSELLO ─────────────────────────────────────────
  let adCarousel = { ads: [], cur: 0, timer: null, duration: 8000 };

  function buildSlide(ad, idx) {
    const div = document.createElement('div');
    div.className = 'ad-slide';
    div.dataset.idx = idx;

    if (ad.image) {
      const img = document.createElement('img');
      img.className = 'ad-slide-img visible';
      img.src = ad.image; img.alt = '';
      div.appendChild(img);
    }

    const body = document.createElement('div');
    body.className = 'ad-slide-body';

    const tag = document.createElement('span');
    tag.className = 'ad-slide-tag';
    tag.textContent = '📣 Sponsor';
    body.appendChild(tag);

    if (ad.title) {
      const t = document.createElement('span');
      t.className = 'ad-slide-title';
      t.textContent = ad.title;
      body.appendChild(t);
    }
    if (ad.text) {
      const tx = document.createElement('span');
      tx.className = 'ad-slide-text';
      tx.textContent = ad.text;
      body.appendChild(tx);
    }
    if (ad.link && ad.linkText) {
      const lk = document.createElement('span');
      lk.className = 'ad-slide-link';
      lk.textContent = (ad.linkText || 'Scopri di più') + ' →';
      body.appendChild(lk);
    }

    div.appendChild(body);
    return div;
  }

  function buildDots(n, cur) {
    const dotsEl = document.getElementById('ad-dots');
    dotsEl.innerHTML = '';
    if (n <= 1) return; // nessun dot se singola slide
    for (let i = 0; i < n; i++) {
      const d = document.createElement('span');
      d.className = 'ad-dot' + (i === cur ? ' on' : '');
      dotsEl.appendChild(d);
    }
  }

  function goToSlide(newIdx) {
    const vp = document.getElementById('ad-slides-viewport');
    const slides = vp.querySelectorAll('.ad-slide');
    const cur = adCarousel.cur;
    if (slides.length === 0) return;
    newIdx = ((newIdx % slides.length) + slides.length) % slides.length;
    if (newIdx === cur && slides.length > 1) return;

    slides[cur]?.classList.add('exit');
    setTimeout(() => slides[cur]?.classList.remove('active', 'exit'), 450);
    slides[newIdx].classList.add('active');
    adCarousel.cur = newIdx;
    buildDots(slides.length, newIdx);
  }

  function startCarousel() {
    stopCarousel();
    const n = adCarousel.ads.length;
    if (n <= 1) return; // singola slide: niente timer
    adCarousel.timer = setInterval(() => {
      goToSlide((adCarousel.cur + 1) % n);
    }, adCarousel.duration);
  }

  function stopCarousel() {
    if (adCarousel.timer) { clearInterval(adCarousel.timer); adCarousel.timer = null; }
  }

  function applyAd(d) {
    const banner = document.getElementById('ad-banner');
    const ads    = Array.isArray(d.ads) ? d.ads.filter(a => a.title || a.image) : [];

    if (!d.adVisible || ads.length === 0) {
      stopCarousel();
      banner.classList.remove('show');
      return;
    }

    adCarousel.duration = (d.adDuration || 8) * 1000;

    // Ricostruisce le slide solo se il contenuto è cambiato
    const newKey = JSON.stringify(ads);
    if (adCarousel._lastKey !== newKey) {
      adCarousel._lastKey = newKey;
      adCarousel.ads = ads;
      adCarousel.cur = 0;
      stopCarousel();

      const vp = document.getElementById('ad-slides-viewport');
      vp.innerHTML = '';
      ads.forEach((ad, i) => {
        const slide = buildSlide(ad, i);
        if (i === 0) slide.classList.add('active');
        vp.appendChild(slide);
      });
      buildDots(ads.length, 0);
      startCarousel();
    } else {
      // Aggiorna solo la durata se cambiata
      stopCarousel();
      startCarousel();
    }

    banner.classList.add('show');
  }

  onValue(ref(db, 'match'), (snap) => {
    const d = snap.val();
    if (!d) return;

    document.getElementById('comp-label-el').textContent = d.compLabel || '';
    document.getElementById('comp-name-el').textContent  = d.compName  || '';

    const hName = (d.homeName || 'CASA').toUpperCase();
    const aName = (d.awayName || 'OSPITE').toUpperCase();
    document.getElementById('home-name').textContent = hName;
    document.getElementById('away-name').textContent = aName;
    document.getElementById('sp-home-name').textContent = hName;
    document.getElementById('sp-away-name').textContent = aName;

    applyLogo('home', d.homeLogo || '');
    applyLogo('away', d.awayLogo || '');
    applySponsor(d.sponsorLogo || '', d.sponsorLabel || '', !!d.sponsorVisible);
    applyTicker(d.tickerText || '', !!d.tickerVisible, d.tickerText2 || '', !!d.tickerVisible2);
    applyRoster(d.rosterHomeText || '', d.rosterAwayText || '', d.homeName || '', d.awayName || '', !!d.rosterHomeVisible, !!d.rosterAwayVisible);
    applyAd(d);

    // FIX: rinominata as2 → awayScore per leggibilità
    const homeScore = d.homeScore ?? 0;
    const awayScore = d.awayScore ?? 0;
    const hset = d.homeSets ?? 0;
    const aset = d.awaySets ?? 0;

    if (homeScore !== prev.homeScore) {
      document.getElementById('home-score').textContent = homeScore;
      if (homeScore > (prev.homeScore || 0)) bump('home-score');
    }
    if (awayScore !== prev.awayScore) {
      document.getElementById('away-score').textContent = awayScore;
      if (awayScore > (prev.awayScore || 0)) bump('away-score');
    }
    if (hset !== prev.homeSets) {
      document.getElementById('home-sets').textContent = hset;
      if (hset > (prev.homeSets || 0)) showPopup((d.homeName || 'CASA').toUpperCase());
    }
    if (aset !== prev.awaySets) {
      document.getElementById('away-sets').textContent = aset;
      if (aset > (prev.awaySets || 0)) showPopup((d.awayName || 'OSPITE').toUpperCase());
    }
    prev = { homeScore, awayScore, homeSets: hset, awaySets: aset };
  });

  // ── SCOUT ────────────────────────────────────────────────────────
  const SCOUT_KEYS = ['ace','srvErr','att','attErr','block'];

  function updateBar(key, hVal, aVal) {
    const total = hVal + aVal;
    const hPct = total === 0 ? 50 : Math.round(hVal / total * 100);
    const aPct = total === 0 ? 50 : 100 - hPct;
    document.getElementById('sn-home-' + key).textContent = hVal;
    document.getElementById('sn-away-' + key).textContent = aVal;
    document.getElementById('sb-home-' + key).style.width = hPct + '%';
    document.getElementById('sb-away-' + key).style.width = aPct + '%';
    document.getElementById('sp-home-' + key).textContent = total === 0 ? '-' : hPct + '%';
    document.getElementById('sp-away-' + key).textContent = total === 0 ? '-' : aPct + '%';
  }

  function updateRecBar(hOk, hKo, aOk, aKo) {
    const hTot = hOk + hKo, aTot = aOk + aKo;
    const hPct = hTot === 0 ? null : Math.round(hOk / hTot * 100);
    const aPct = aTot === 0 ? null : Math.round(aOk / aTot * 100);
    const bothNull = hPct === null && aPct === null;
    const hBarW = bothNull ? 50 : ((hPct ?? 0) / Math.max((hPct ?? 0) + (aPct ?? 0), 1) * 100);
    const aBarW = bothNull ? 50 : 100 - hBarW;
    document.getElementById('sn-home-rec').textContent = hPct !== null ? hPct + '%' : '-';
    document.getElementById('sn-away-rec').textContent = aPct !== null ? aPct + '%' : '-';
    document.getElementById('sb-home-rec').style.width = hBarW + '%';
    document.getElementById('sb-away-rec').style.width = aBarW + '%';
    document.getElementById('sp-home-rec').textContent = hPct !== null ? hPct + '%' : '-';
    document.getElementById('sp-away-rec').textContent = aPct !== null ? aPct + '%' : '-';
  }

  function applyScout(visible) {
    const panel = document.getElementById('scout-panel');
    if (visible) panel.classList.add('show');
    else panel.classList.remove('show');
  }

  onValue(ref(db, 'scout'), (snap) => {
    const d = snap.val();
    if (!d) { applyScout(false); return; }
    const h = d.home || {}, a = d.away || {};
    SCOUT_KEYS.forEach(k => updateBar(k, h[k] ?? 0, a[k] ?? 0));
    updateRecBar(h.recOk ?? 0, h.recKo ?? 0, a.recOk ?? 0, a.recKo ?? 0);
    applyScout(!!d.visible);
  });
</script>
</body>
</html>
