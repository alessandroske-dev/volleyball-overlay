*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0f1a;--surface:#111827;--surface2:#1a2235;
  --border:#2a3a55;--sand:#e8c97a;--accent:#1a6fb5;
  --success:#38a169;--text:#f0f4ff;--muted:#6b7a99;
  --radius:.75rem;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding:1rem 0 3rem}

.header{text-align:center;padding:1.5rem 1rem 1rem}
.header h1{font-family:'Oswald',sans-serif;font-size:1.3rem;letter-spacing:.1rem;color:var(--sand);text-transform:uppercase}
.header p{font-size:.75rem;color:var(--muted);margin-top:.4rem}

.wrapper{padding:0 .75rem;display:flex;flex-direction:column;gap:.75rem}

/* CARD TAPPA */
.tappa{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.tappa-header{
  display:flex;align-items:center;gap:.8rem;
  padding:.85rem 1rem;
  border-bottom:1px solid var(--border);
  background:var(--surface2);
}
.tappa-num{
  font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.1rem;
  color:var(--muted);background:var(--bg);
  border:1px solid var(--border);border-radius:.35rem;
  padding:.2rem .55rem;white-space:nowrap;
}
.tappa-date{
  font-family:'Oswald',sans-serif;font-size:1.1rem;font-weight:700;color:var(--sand);
}
.tappa-city{font-size:.85rem;font-weight:600;flex:1}
.tappa-prov{font-size:.7rem;color:var(--muted);margin-left:.2rem}

/* ROWS */
.rows{display:flex;flex-direction:column}
.row{
  display:grid;grid-template-columns:90px 1fr;
  border-bottom:1px solid rgba(42,58,85,.6);
}
.row:last-child{border-bottom:none}
.row-label{
  font-size:.62rem;letter-spacing:.1rem;text-transform:uppercase;
  color:var(--muted);padding:.55rem .75rem;
  background:rgba(0,0,0,.15);
  display:flex;align-items:center;
}
.row-val{
  font-size:.82rem;padding:.55rem .75rem;
  display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;
  word-break:break-word;
}
.row-val strong{font-weight:600}

/* Copy button */
.copy-btn{
  background:none;border:1px solid var(--border);border-radius:.3rem;
  color:var(--muted);font-size:.65rem;padding:.15rem .4rem;cursor:pointer;
  white-space:nowrap;transition:all .2s;flex-shrink:0;
}
.copy-btn:active,.copy-btn.copied{background:var(--success);color:#fff;border-color:var(--success)}

/* Link */
.ext-link{
  display:inline-flex;align-items:center;gap:.3rem;
  color:var(--sand);font-size:.78rem;text-decoration:none;
  border:1px solid rgba(232,201,122,.3);border-radius:.3rem;
  padding:.25rem .6rem;transition:all .2s;
}
.ext-link:active{background:rgba(232,201,122,.1)}
.ext-link svg{width:12px;height:12px;fill:var(--sand);flex-shrink:0}

/* Toast */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(10px);
  background:#1e2d45;color:#fff;padding:.55rem 1.1rem;border-radius:2rem;
  font-size:.8rem;white-space:nowrap;opacity:0;transition:all .25s;z-index:999;
  border:1px solid var(--border);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Legend */
.legend{
  margin:.5rem .75rem 0;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:.85rem 1rem;font-size:.72rem;color:var(--muted);line-height:1.7;
}
.legend strong{color:var(--sand)}
</style>

function copyText(text, btn) {
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-999px;left:-999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e) { prompt('Copia manualmente:', text); }
    document.body.removeChild(ta);
  }
  function ok() {
    btn.classList.add('copied');
    btn.textContent = '✓';
    showToast('Copiato: ' + text.substring(0, 40) + (text.length > 40 ? '…' : ''));
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋'; }, 1500);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(ok).catch(() => { fallback(); ok(); });
  } else {
    fallback(); ok();
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function row(label, value, copyVal) {
  const v = copyVal ?? value;
  return `<div class="row">
    <div class="row-label">${label}</div>
    <div class="row-val">
      <span>${value}</span>
      <button class="copy-btn" onclick="copyText(${JSON.stringify(v)}, this)">📋</button>
    </div>
  </div>`;
}

function linkRow(label, text, href) {
  return `<div class="row">
    <div class="row-label">${label}</div>
    <div class="row-val">
      <a class="ext-link" href="${href}" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42L17.59 5H14V3zm-1 2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8h-2v8H5V7h8V5z"/></svg>
        ${text}
      </a>
      <button class="copy-btn" onclick="copyText(${JSON.stringify(href)}, this)">📋</button>
    </div>
  </div>`;
}
