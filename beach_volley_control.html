<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🏐 Control Panel – Beach Volley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0f1a;
  --surface:#111827;
  --surface2:#1a2235;
  --border:#2a3a55;
  --sand:#e8c97a;
  --sand-dim:rgba(232,201,122,.15);
  --accent:#1a6fb5;
  --danger:#e53e3e;
  --success:#38a169;
  --text:#f0f4ff;
  --muted:#6b7a99;
  --radius:.75rem;
  --font:'Inter',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
body{padding-bottom:2rem}

/* ─── TOP BAR ─── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:.85rem 1rem;
  display:flex;align-items:center;justify-content:space-between;
}
.topbar-title{font-family:'Oswald',sans-serif;font-size:1.1rem;letter-spacing:.1rem;color:var(--sand)}
.topbar-status{font-size:.7rem;display:flex;align-items:center;gap:.4rem;color:var(--muted)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status-dot.ok{background:var(--success);box-shadow:0 0 6px var(--success)}
.status-dot.err{background:var(--danger)}
.status-dot.loading{background:var(--sand);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── SAVE BTN ─── */
.save-bar{
  position:sticky;bottom:0;z-index:100;
  padding:.85rem 1rem;
  background:var(--bg);
  border-top:1px solid var(--border);
}
.btn-save{
  width:100%;padding:1rem;
  background:var(--sand);color:#0a0f1a;
  font-family:'Oswald',sans-serif;font-size:1.1rem;letter-spacing:.15rem;
  border:none;border-radius:var(--radius);cursor:pointer;
  text-transform:uppercase;font-weight:700;
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
}
.btn-save:active{transform:scale(.97);opacity:.85}
.btn-save:disabled{background:#555;color:#aaa;cursor:not-allowed}
.btn-save.saving{background:#555;color:#aaa}
.btn-save.saved{background:var(--success);color:#fff}

/* ─── SECTIONS ─── */
.main{padding:.5rem .75rem}

.section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin:.75rem 0;
  overflow:hidden;
}
.section-header{
  padding:.85rem 1rem;
  display:flex;align-items:center;gap:.6rem;
  cursor:pointer;
  user-select:none;
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.section-header.open{border-color:var(--border)}
.section-icon{font-size:1.1rem}
.section-title{font-family:'Oswald',sans-serif;font-size:.95rem;letter-spacing:.08rem;flex:1}
.chevron{font-size:.75rem;color:var(--muted);transition:transform .25s}
.chevron.open{transform:rotate(180deg)}

.section-body{
  display:none;
  padding:.75rem 1rem 1rem;
  flex-direction:column;gap:.75rem;
}
.section-body.open{display:flex}

/* ─── FORM ELEMENTS ─── */
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{font-size:.68rem;letter-spacing:.12rem;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:.55rem;
  color:var(--text);
  font-family:var(--font);
  font-size:.95rem;
  padding:.7rem .9rem;
  width:100%;
  transition:border-color .2s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sand)}
.field textarea{resize:vertical;min-height:60px}
.field input[type="datetime-local"]{color-scheme:dark}

/* Logo preview */
.logo-preview{
  width:52px;height:52px;border-radius:50%;
  background:var(--surface2);border:1px solid var(--border);
  object-fit:contain;padding:4px;
  display:block;margin-top:.3rem;
}

/* Row 2 col */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

/* ─── TOGGLE ─── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.toggle-label{font-size:.85rem}
.toggle{position:relative;width:48px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{
  position:absolute;inset:0;background:var(--border);border-radius:13px;cursor:pointer;transition:.3s;
}
.toggle-slider::before{
  content:'';position:absolute;width:20px;height:20px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:.3s;
}
.toggle input:checked + .toggle-slider{background:var(--success)}
.toggle input:checked + .toggle-slider::before{transform:translateX(22px)}

/* ─── QUICK ACTIONS ─── */
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.75rem 0}
.btn-action{
  padding:.8rem .5rem;border-radius:.6rem;border:1px solid var(--border);
  background:var(--surface);color:var(--text);cursor:pointer;
  font-size:.78rem;font-family:var(--font);
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  transition:all .2s;
}
.btn-action:active{transform:scale(.95)}
.btn-action .icon{font-size:1.4rem}
.btn-action.danger{border-color:rgba(229,62,62,.3);color:var(--danger)}
.btn-action.warning{border-color:rgba(232,201,122,.3);color:var(--sand)}

/* Toast */
.toast{
  position:fixed;bottom:5rem;left:50%;transform:translateX(-50%) translateY(10px);
  background:#222;color:#fff;padding:.6rem 1.2rem;border-radius:2rem;
  font-size:.82rem;white-space:nowrap;opacity:0;transition:all .3s;z-index:999;
  border:1px solid var(--border);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">🏐 CONTROL PANEL</div>
  <div class="topbar-status">
    <div class="status-dot loading" id="status-dot"></div>
    <span id="status-text">Autenticazione...</span>
  </div>
</div>

<div class="main">

  <!-- QUICK ACTIONS -->
  <div class="quick-actions">
    <button class="btn-action danger" onclick="clearAll()" style="grid-column:1/-1">
      <span class="icon">🗑️</span>Reset tutti i dati
    </button>
  </div>

  <!-- SQUADRE -->
  <div class="section">
    <div class="section-header" onclick="toggle(this)">
      <span class="section-icon">👕</span>
      <span class="section-title">Squadre</span>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="field">
        <label>Nome Squadra A</label>
        <input type="text" id="nomeA" placeholder="es. ASD Pallavolo Cingia 2^">
      </div>
      <div class="field">
        <label>Logo URL Squadra A</label>
        <input type="url" id="logoA" placeholder="https://..." oninput="previewLogo('logoA','prevA')">
        <img id="prevA" class="logo-preview" src="" alt="" style="display:none">
      </div>
      <div class="field">
        <label>Nome Squadra B</label>
        <input type="text" id="nomeB" placeholder="es. Polenghi Blu Volley">
      </div>
      <div class="field">
        <label>Logo URL Squadra B</label>
        <input type="url" id="logoB" placeholder="https://..." oninput="previewLogo('logoB','prevB')">
        <img id="prevB" class="logo-preview" src="" alt="" style="display:none">
      </div>
    </div>
  </div>

  <!-- PARTITA -->
  <div class="section">
    <div class="section-header" onclick="toggle(this)">
      <span class="section-icon">📋</span>
      <span class="section-title">Info Partita</span>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="field">
        <label>Tag Sport</label>
        <input type="text" id="sportTag" placeholder="Pallavolo Indoor · Seconda Divisione Femminile">
      </div>
      <div class="field">
        <label>Sottotitolo (es. Playoff Girrone D · Gara 11686)</label>
        <input type="text" id="subtitle" placeholder="Playoff Girrone D · Gara 11686">
      </div>
      <div class="row2">
        <div class="field">
          <label>Data (es. 15 Mag 2026)</label>
          <input type="text" id="data" placeholder="15 Mag 2026">
        </div>
        <div class="field">
          <label>Ora (es. 20:30)</label>
          <input type="text" id="ora" placeholder="20:30">
        </div>
      </div>
      <div class="field">
        <label>Kickoff (per countdown)</label>
        <input type="datetime-local" id="kickoff">
      </div>
      <div class="field">
        <label>Competizione</label>
        <input type="text" id="competizione" placeholder="2ª Div. F. Playoff Gir. D">
      </div>
      <div class="field">
        <label>Luogo breve (nella card)</label>
        <input type="text" id="luogo" placeholder="Cingia de' Botti (CR)">
      </div>
    </div>
  </div>

  <!-- IMPIANTO -->
  <div class="section">
    <div class="section-header" onclick="toggle(this)">
      <span class="section-icon">📍</span>
      <span class="section-title">Impianto & Maps</span>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="field">
        <label>Nome impianto completo</label>
        <input type="text" id="impianto" placeholder="Palestra Comunale · Via Rodano · Cingia de' Botti CR">
      </div>
      <div class="field">
        <label>Link Google Maps</label>
        <input type="url" id="mapsUrl" placeholder="https://www.google.com/maps/search/?api=1&query=...">
        <p style="font-size:.65rem;color:var(--muted);margin-top:.2rem">Copia il link da Google Maps → Condividi</p>
      </div>
    </div>
  </div>

  <!-- YOUTUBE -->
  <div class="section">
    <div class="section-header" onclick="toggle(this)">
      <span class="section-icon">▶️</span>
      <span class="section-title">YouTube / Streaming</span>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="field">
        <label>Video ID (es. GUScR0e0C_E)</label>
        <input type="text" id="ytVideoId" placeholder="GUScR0e0C_E" maxlength="20">
        <p style="font-size:.65rem;color:var(--muted);margin-top:.2rem">Dall'URL: youtube.com/watch?v=<strong>ID_QUI</strong></p>
      </div>
      <div class="field">
        <label>Handle canale</label>
        <input type="text" id="ytHandle" placeholder="@alessandroske">
      </div>
    </div>
  </div>

  <!-- PROSSIMA PARTITA -->
  <div class="section">
    <div class="section-header" onclick="toggle(this)">
      <span class="section-icon">🗓️</span>
      <span class="section-title">Prossima Partita</span>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="field">
        <label>Titolo (es. Turno successivo)</label>
        <input type="text" id="nextTitle" placeholder="Turno successivo">
      </div>
      <div class="row2">
        <div class="field">
          <label>Casa</label>
          <input type="text" id="nextHome" placeholder="ASD Pallavolo Cingia">
        </div>
        <div class="field">
          <label>Ospite</label>
          <input type="text" id="nextAway" placeholder="Da definire">
        </div>
      </div>
      <div class="field">
        <label>Luogo prossima</label>
        <input type="text" id="nextLuogo" placeholder="Cingia de' Botti (CR) – in attesa di conferma">
      </div>
      <div class="field">
        <label>Competizione prossima</label>
        <input type="text" id="nextComp" placeholder="2ª Divisione Femminile · Playoff">
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="section">
    <div class="section-header" onclick="toggle(this)">
      <span class="section-icon">📝</span>
      <span class="section-title">Footer</span>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="field">
        <label>Testo footer</label>
        <input type="text" id="footer" placeholder="Streaming gratuito · #Alyssa26 · Gara 11686 · Giornata 1">
      </div>
    </div>
  </div>

</div><!-- /main -->

<div class="save-bar">
  <button class="btn-save" id="btn-save" onclick="saveAll()" disabled>
    <span>⏳</span> Connessione...
  </button>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp }          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCJLdA9iKxoR3WJSrjGM7ltUpjpDRNyiyQ",
  authDomain:        "volley-overlay.firebaseapp.com",
  databaseURL:       "https://volley-overlay-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "volley-overlay",
  storageBucket:     "volley-overlay.firebasestorage.app",
  messagingSenderId: "643750913822",
  appId:             "1:643750913822:web:3c1fde3fdceb6a71e3cb0f"
};

const app  = initializeApp(firebaseConfig);
const db   = getDatabase(app);
const auth = getAuth(app);

const dbRef = ref(db, 'beach_volley');

const FIELDS = [
  'nomeA','nomeB','logoA','logoB','sportTag','subtitle','data','ora',
  'competizione','luogo','impianto','mapsUrl','ytVideoId','ytHandle',
  'nextTitle','nextHome','nextAway','nextLuogo','nextComp','footer'
];

// ── UI helpers ──────────────────────────────────────────────
function setStatus(state, msg) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  dot.className = 'status-dot ' + state;   // loading | ok | err
  txt.textContent = msg;
}

function setBtnReady(ready) {
  const btn = document.getElementById('btn-save');
  btn.disabled = !ready;
  if (ready) {
    btn.className = 'btn-save';
    btn.innerHTML = '<span>💾</span> Salva tutto su Firebase';
  }
}

// ── Auth anonima → poi subscribe al DB ──────────────────────
signInAnonymously(auth).catch(err => {
  setStatus('err', 'Auth fallita');
  showToast('❌ Auth: ' + err.message);
});

onAuthStateChanged(auth, user => {
  if (!user) return;

  setStatus('loading', 'Connessione DB...');

  // Subscribe realtime
  onValue(dbRef, snap => {
    setStatus('ok', 'Firebase OK');
    setBtnReady(true);

    const d = snap.val();
    if (!d) return;

    FIELDS.forEach(f => {
      const el = document.getElementById(f);
      if (el && d[f] !== undefined) el.value = d[f];
    });

    // datetime-local: converte ISO → local
    if (d.kickoff) {
      const dt    = new Date(d.kickoff);
      const local = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000)
                      .toISOString().slice(0, 16);
      document.getElementById('kickoff').value = local;
    }

    if (d.logoA) previewLogo('logoA', 'prevA');
    if (d.logoB) previewLogo('logoB', 'prevB');

  }, err => {
    setStatus('err', 'Errore DB');
    showToast('❌ DB: ' + err.message);
    setBtnReady(false);
  });
});

// ── Salva ───────────────────────────────────────────────────
window.saveAll = async function () {
  const btn = document.getElementById('btn-save');
  btn.className = 'btn-save saving';
  btn.disabled  = true;
  btn.innerHTML = '<span>⏳</span> Salvataggio...';

  const kickoffRaw = document.getElementById('kickoff').value;
  const kickoffISO = kickoffRaw ? new Date(kickoffRaw).toISOString() : null;

  const payload = { kickoff: kickoffISO };
  FIELDS.forEach(f => {
    payload[f] = document.getElementById(f).value;
  });

  try {
    await set(dbRef, payload);
    btn.className = 'btn-save saved';
    btn.disabled  = false;
    btn.innerHTML = '<span>✅</span> Salvato!';
    showToast('✅ Dati aggiornati su Firebase');
    setTimeout(() => {
      btn.className = 'btn-save';
      btn.innerHTML = '<span>💾</span> Salva tutto su Firebase';
    }, 2000);
  } catch (e) {
    btn.className = 'btn-save';
    btn.disabled  = false;
    btn.innerHTML = '<span>💾</span> Salva tutto su Firebase';
    showToast('❌ Errore: ' + e.message);
  }
};

// ── Reset ───────────────────────────────────────────────────
window.clearAll = function () {
  if (!confirm('Sei sicuro di voler resettare TUTTI i dati?')) return;
  set(dbRef, null)
    .then(() => showToast('🗑️ Dati cancellati'))
    .catch(e  => showToast('❌ ' + e.message));
};
</script>

<script>
// Toggle sezioni
function toggle(header) {
  const body    = header.nextElementSibling;
  const chevron = header.querySelector('.chevron');
  const isOpen  = body.classList.contains('open');
  body.classList.toggle('open',    !isOpen);
  chevron.classList.toggle('open', !isOpen);
  header.classList.toggle('open',  !isOpen);
}

// Preview logo
function previewLogo(inputId, imgId) {
  const url = document.getElementById(inputId).value;
  const img = document.getElementById(imgId);
  if (url) { img.src = url; img.style.display = 'block'; }
  else img.style.display = 'none';
}
window.previewLogo = previewLogo;

// Toast
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
window.showToast = showToast;
</script>
</body>
</html>
